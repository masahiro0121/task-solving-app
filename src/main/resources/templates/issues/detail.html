<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>課題詳細｜課題管理アプリケーション</title>
</head>
<body>
    <h1 class="mt-3">課題詳細</h1>
    <a href="./list.html" th:href="@{/issues}">一覧に戻る</a>
<div>
    <h2 th:text="${issue.summary}">(summary)</h2>
    <p th:text="${issue.description}">(description)</p>
    <p>ステータス: <span th:text="${issue.status}">(status)</span></p>
</div>
<div>
    <a href="./detail.html" th:href="@{/issues/{issueId}/editForm(issueId=${issue.id})}" class="btn btn-primary">編集</a>
    <form th:action="@{/issues/{issueId}(issueId=${issue.id})}"
          th:method="delete"
          style="display:inline;"
          onclick="return confirm('本当に削除しますか？');">
        <button type="submit" class="btn btn-danger">削除</button>
    </form>
</div>
</body>
</html>
