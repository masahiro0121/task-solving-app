<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー一覧</title>
</head>
<body>
<h1>ユーザー一覧</h1>
<a href="../index.html" th:href="@{/}">トップページ</a>
<a href="../creationForm.html" th:href="@{/users/creationForm}">ユーザー作成</a>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>ユーザー名</th>
        <th>権限</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${userList}">
        <td th:text="${user.id}">(id)</td>
        <td th:text="${user.username}">(username)</td>
        <td th:text="${user.authority}">(authority)</td>
    </tr>
    </tbody>
</table>
</body>
</html>
